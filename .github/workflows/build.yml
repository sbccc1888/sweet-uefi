name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld python3-pil fonts-dejavu-core

      - name: Build, render and verify
        run: ./test.sh

      - name: Show the design
        run: |
          file out/sweet-uefi.efi
          ls -l out/sweet-uefi.efi

      - uses: actions/upload-artifact@v4
        with:
          name: sweet-uefi
          path: |
            out/sweet-uefi.efi
            /tmp/preview.png
